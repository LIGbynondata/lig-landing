<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIG | Pádel competitivo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f4ef;
      color: #111;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .box {
      max-width: 720px;
      padding: 48px 24px;
    }

    h1 {
      font-size: 56px;
      margin: 0 0 16px;
      color: #c8a600;
    }

    p {
      font-size: 22px;
      line-height: 1.4;
      margin: 0 0 28px;
    }

    .tag {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="tag">Muy pronto</div>
    <h1>LIG</h1>
    <p>La nueva forma de competir, conectar y escalar en el pádel.</p>
    <p>Estamos preparando el circuito digital para jugadores, clubes y comunidades.</p>
  </main>
</body>
</html>
